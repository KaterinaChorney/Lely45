{% extends "base.html" %}

{% block title %}Помилка {{ code }} — Lely45{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="text-align: center; padding: 4rem 0;">
    <span class="eyebrow" style="justify-content: center;">HTTP {{ code }}</span>
    <h1 style="font-size: clamp(3rem, 7vw, 5.5rem); margin-bottom: 1rem;">{{ title }}</h1>
    <p class="section-lead" style="margin: 0 auto 2rem;">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Повернутися на Головну</a>
  </div>
</section>
{% endblock %}
