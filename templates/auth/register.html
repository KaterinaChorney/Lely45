{% extends "base.html" %}

{% block title %}Реєстрація — Lely45 / Lyuda Bielousova{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="form-card">
      <span class="eyebrow">Новий користувач</span>
      <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Реєстрація</h1>
      <p style="color: var(--text-secondary); margin-top: 0; margin-bottom: 1.75rem;">
        Створіть власний акаунт, щоб отримати доступ до додавання, редагування та видалення альбомів.
      </p>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="username">Логін</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            required
            minlength="3"
            maxlength="40"
            placeholder="Наприклад: music_fan"
            value="{{ username or '' }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Електронна пошта</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
            placeholder="you@example.com"
            value="{{ email or '' }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль (мін. 6 символів)</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
            minlength="6"
            placeholder="••••••••"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Підтвердження пароля</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-control"
            required
            minlength="6"
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Створити акаунт</button>
      </form>

      <p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin-top: 1.4rem; margin-bottom: 0;">
        Уже маєте акаунт? <a href="{{ url_for('login') }}" class="link-accent">Увійти</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
