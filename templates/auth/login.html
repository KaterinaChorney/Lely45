{% extends "base.html" %}

{% block title %}Вхід — Lely45 / Lyuda Bielousova{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="form-card">
      <span class="eyebrow">Авторизація</span>
      <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Увійти в акаунт</h1>
      <p style="color: var(--text-secondary); margin-top: 0; margin-bottom: 1.75rem;">
        Авторизуйтеся, щоб додавати нові альбоми, редагувати треклисти та керувати дискографією.
      </p>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="username">Логін або Email</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            required
            autofocus
            placeholder="admin або email@example.com"
            value="{{ identifier or '' }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
            placeholder="••••••••"
          >
        </div>

        <div class="form-group">
          <label class="checkbox-row">
            <input type="checkbox" name="remember">
            <span>Запам'ятати мене</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Увійти</button>
      </form>

      <p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin-top: 1.4rem; margin-bottom: 0;">
        Ще немає акаунту? <a href="{{ url_for('register') }}" class="link-accent">Зареєструватися</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
